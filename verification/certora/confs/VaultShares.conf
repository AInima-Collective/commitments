// P3-PPS + P3-ROUND scene (PROPERTIES.md).
//
// CommitmentsVault is verified DIRECTLY as the ERC-4626 implementation (the
// VaultFactory deploys it behind an ERC-1967 proxy in production, but the
// prover reasons over the implementation's code + EIP-7201 storage — proxy
// slot regressions stay owned by test/StorageSlots.t.sol, mirroring how
// ManagerSmoke verifies the manager impl directly). No external DELEGATECALL
// libraries: the vault is self-contained (OZ ERC4626Upgradeable + AccessControl
// + UUPS, all resolved from the openzeppelin packages below).
//
// DummyERC20 is the standard-token asset model (no fee-on-transfer / rebasing /
// hooks — the PROPERTIES.md verification assumption); all IERC20 calls DISPATCH
// to it. Compiler settings mirror foundry.toml (optimizer 200, cancun); code
// size is not enforced by the prover.
{
    "files": [
        "src/periphery/vaults/CommitmentsVault.sol",
        "verification/certora/harnesses/DummyERC20.sol"
    ],
    "verify": "CommitmentsVault:verification/certora/specs/VaultShares.spec",
    "solc": "solc0.8.27",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "@openzeppelin/contracts-upgradeable=lib/openzeppelin-contracts-upgradeable/contracts"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    // Parametric rules/invariants range over vault methods only — a naked
    // asset transfer into the vault (donation) is adversary-modeled inside the
    // rules, not as a parametric step (run-260713 triage family D).
    "parametric_contracts": ["CommitmentsVault"],
    // yices has no arm64 binary in this container (run-260713 infra finding:
    // 13k+ dead portfolio queries); race only the solvers that exist.
    "prover_args": ["-solvers [z3,cvc5]"],
    "msg": "P3-PPS share-price non-decrease and no-inflation, P3-ROUND rounding favors vault"
}
