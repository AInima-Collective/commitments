// Smoke conf: CommitmentManager linked with its five external
// DELEGATECALL libraries in one scene. Solidity library calls are resolved by
// including the libraries in `files` — the prover links them automatically.
//
// solc: certoraRun needs a standalone binary. Foundry's managed binary works:
//   ~/.local/share/svm/0.8.27/solc-0.8.27 (symlinked as solc0.8.27 on PATH by
//   verification/README.md setup). Compiler settings mirror foundry.toml
//   (optimizer 200, cancun) EXCEPT the manager itself, which foundry compiles
//   at optimizer_runs=1 for EIP-170 headroom — the prover has no per-file
//   optimizer map, and runs=1 vs 200 is semantics-preserving, so one setting
//   for the whole scene is fine (code size is not enforced by the prover).
{
    "files": [
        "verification/certora/harnesses/CommitmentManagerHarness.sol",
        "verification/certora/harnesses/DummyERC20.sol",
        "src/core/manager/libraries/CommitmentLifecycleLib.sol",
        "src/core/manager/libraries/LedgerOpsLib.sol",
        "src/core/manager/libraries/MovementLib.sol",
        "src/extensions/agreements/AgreementLib.sol",
        "src/extensions/mutuals/MutualLib.sol"
    ],
    "verify": "CommitmentManagerHarness:verification/certora/specs/ManagerSmoke.spec",
    "solc": "solc0.8.27",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "@openzeppelin/contracts-upgradeable=lib/openzeppelin-contracts-upgradeable/contracts"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    // createCommitmentFor hashes the EIP-712 struct (dynamic strategies[] +
    // metadata string); the default 224-byte hashing bound flags it. The
    // protocol caps metadataURI (MAX_METADATA_URI_LENGTH) and strategies
    // (MAX_STRATEGIES), so a bounded-hash assumption is faithful.
    "optimistic_hashing": true,
    "hashing_length_bound": "512",
    "rule_sanity": "basic",
    // Parametric rules range over manager methods only (run-260713 family D).
    "parametric_contracts": ["CommitmentManagerHarness"],
    // yices has no arm64 binary in this container (run-260713 infra finding);
    // race only the solvers that exist.
    "prover_args": ["-solvers [z3,cvc5]"],
    "msg": "Smoke: INV-10 on linked manager scene"
}
