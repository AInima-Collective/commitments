// P0 ledger soundness scene (PROPERTIES.md). The harness extends the
// manager with envfree aggregate accessors (no new state — EIP-7201 layout is
// byte-identical); the five external DELEGATECALL libraries link into the
// scene; DummyERC20 is the standard-token model all IERC20 calls dispatch to.
{
    "files": [
        "verification/certora/harnesses/CommitmentManagerHarness.sol",
        "verification/certora/harnesses/DummyERC20.sol",
        "src/core/manager/libraries/CommitmentLifecycleLib.sol",
        "src/core/manager/libraries/LedgerOpsLib.sol",
        "src/core/manager/libraries/MovementLib.sol",
        "src/extensions/agreements/AgreementLib.sol",
        "src/extensions/mutuals/MutualLib.sol"
    ],
    "verify": "CommitmentManagerHarness:verification/certora/specs/ManagerLedger.spec",
    "solc": "solc0.8.27",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "@openzeppelin/contracts-upgradeable=lib/openzeppelin-contracts-upgradeable/contracts"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    // Parametric rules/invariants range over manager methods only: a naked
    // token donation into the manager breaks the exact partition by design
    // (run-260713 triage family D; matches the fuzz-suite world and the ERC's
    // accounted-flow framing).
    "parametric_contracts": ["CommitmentManagerHarness"],
    // yices has no arm64 binary in this container (run-260713 infra finding:
    // 13k+ dead portfolio queries); race only the solvers that exist.
    "prover_args": ["-solvers [z3,cvc5]"],
    "msg": "P0 ledger soundness (partition, INV-3/4/5/10, P0-FREE)"
}
