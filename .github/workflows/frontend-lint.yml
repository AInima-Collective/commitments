# Frontend lint guardrails — Phase 22 (Foundation), FND-05.
# Runs ESLint and Stylelint on every pull_request that touches the frontend.
# Currently both rule sets include `warn` level entries (hex literals, deep ui
# imports, CSS hex literals) — those are visible in CI logs but do not block
# merges. Phase 28 (LCK-01) promotes them to `error`.

name: Frontend Lint

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-lint.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'

jobs:
  lint:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads the pinned version from the
      # root package.json `packageManager` field. Specifying both errors out with
      # ERR_PNPM_BAD_PM_VERSION (multiple versions specified).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (frontend)
        run: pnpm --filter @commitments/frontend lint

      - name: Run Stylelint (frontend)
        run: pnpm --filter @commitments/frontend lint:css
